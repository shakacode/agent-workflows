---
base_branch: main
repo_prefix: "AW"
follow_up_prefix: "Follow-up:"
review_gate: "current-head approval from a human collaborator; administrator code-owner approval for executable or agent-instruction surfaces"
automation_reviewers: "claude-review (GitHub Action; in-flight and terminal state observable via the checks API) and coderabbitai (advisory; may fail on rate limits)"
approval_exempt: "ordinary root documentation and validation fixtures only; agent instructions, executable helpers, distribution metadata, and CI workflows are never exempt"
# This source repo runs in single-operator mode; consumer repos pick their own
# coordination backend in their local seam.
coordination_backend: "n/a"
agent_claimed_label: "agent-claimed"
changelog: "CHANGELOG.md"
benchmark_labels: "n/a"
merge_ledger: "n/a"
ci_parity_environment: "n/a"
hosted_ci_trigger: "n/a"
ci_change_detector: "n/a"
autonomous_merge:
  thresholds:
    max_changed_files: 29
    max_changed_lines: 999
    max_commits: 9
    max_reviewed_heads: 3
  human_review_paths:
    - id: repository-agent-policy
      pattern: "AGENTS.md"
      reason: security
    - id: repository-agent-contract
      pattern: ".agents/**"
      reason: security
    - id: claude-plugin-metadata
      pattern: ".claude-plugin/**"
      reason: security
    - id: codex-plugin-metadata
      pattern: ".codex-plugin/**"
      reason: security
    - id: github-policy-and-workflows
      pattern: ".github/**"
      reason: infrastructure
    - id: distribution-tools
      pattern: "bin/**"
      reason: release
    - id: agent-skills
      pattern: "skills/**"
      reason: security
    - id: fallback-workflows
      pattern: "workflows/**"
      reason: security
    - id: shell-scripts
      pattern: "**/*.sh"
      reason: security
    - id: bash-scripts
      pattern: "**/*.bash"
      reason: security
  policy_paths:
    - "skills/pr-batch/bin/autonomous-merge-*"
    - "skills/pr-batch/lib/autonomous_merge_*"
  safe_path_groups:
    documentation:
      include:
        - "docs/**"
      exclude:
        - "docs/adr/**"
        - "docs/installation-and-upgrades.md"
        - "docs/release-branching.md"
        - "docs/seam-design.md"
    tests:
      include:
        - "test/**"
        - "**/*-test.rb"
        - "**/*_test.rb"
        - "**/*-test.bash"
      exclude:
        - "test/fixtures/consumer-repo/**"
secret_redaction_patterns: "conservative default; consumer repos may define repo-specific CI parity redaction patterns"
default_simplify_model: "n/a"
untrusted_contributor_intake:
  trusted_github_host: "github.com"
  trusted_github_scheme: "https"
  trusted_github_repo: "shakacode/agent-workflows"
