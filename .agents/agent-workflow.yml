---
base_branch: main
repo_prefix: "AW"
follow_up_prefix: "Follow-up:"
review_gate: "independent code review for non-trivial workflow or helper changes"
automation_reviewers: "claude-review (GitHub Action; in-flight and terminal state observable via the checks API) and coderabbitai (advisory; may fail on rate limits)"
approval_exempt: "docs, workflow text, helper scripts, skill metadata, and validation fixtures when the change remains portable"
# This source repo runs in single-operator mode; consumer repos pick their own
# coordination backend in their local seam.
coordination_backend: "n/a"
agent_claimed_label: "agent-claimed"
changelog: "CHANGELOG.md"
benchmark_labels: "n/a"
merge_ledger: "n/a"
ci_parity_environment: "n/a"
hosted_ci_trigger: "n/a"
hosted_qa_gate: "n/a — this source pack has no deployed application runtime"
ci_change_detector: "n/a"
autonomous_merge:
  thresholds:
    max_changed_files: 29
    max_changed_lines: 999
    max_commits: 9
    max_reviewed_heads: 3
  human_review_paths:
    - id: github-workflows
      pattern: ".github/workflows/**"
      reason: infrastructure
    - id: distribution-tools
      pattern: "bin/*agent-workflows"
      reason: release
    - id: downstream-publishing
      pattern: "bin/push-downstream"
      reason: release
  policy_paths:
    - "skills/pr-batch/bin/autonomous-merge-*"
    - "skills/pr-batch/lib/autonomous_merge_*"
  safe_path_groups:
    documentation:
      include:
        - "docs/**"
      exclude:
        - "docs/adr/**"
        - "docs/installation-and-upgrades.md"
        - "docs/release-branching.md"
        - "docs/seam-design.md"
    tests:
      include:
        - "test/**"
        - "**/*-test.rb"
        - "**/*_test.rb"
        - "**/*-test.bash"
      exclude:
        - "test/fixtures/consumer-repo/**"
secret_redaction_patterns: "conservative default; consumer repos may define repo-specific CI parity redaction patterns"
default_simplify_model: "n/a"
untrusted_contributor_intake:
  trusted_github_host: "github.com"
  trusted_github_scheme: "https"
  trusted_github_repo: "shakacode/agent-workflows"
