# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit is advisory in this repository. Repository policy
# (workflows/pr-batch-integration-closeout.md, "Review Completion Gate") treats
# AI review systems as input to triage, not as merge gates. Keep CodeRabbit
# from submitting CHANGES_REQUESTED review objects, which the main branch
# ruleset would otherwise honor as a merge block until a human dismisses them.
reviews:
  # Keep CodeRabbit advisory and quiet: its substantive walkthrough remains
  # available, while skipped/rate-limit prose and GitHub progress checks do not
  # occupy the PR timeline.
  profile: chill
  review_status: false
  review_progress: false
  in_progress_fortune: false
  collapse_walkthrough: true
  request_changes_workflow: false
  auto_review:
    # The lifecycle workflow applies one of these labels on PR creation and on
    # conversion from draft to ready. This avoids a review for every push.
    enabled: false
    auto_incremental_review: false
    labels:
      - coderabbit:first-pass
      - coderabbit:ready
