name: Check process-gap mechanism target

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write

concurrency:
  group: process-gap-mechanism-target-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "3.4"

      - name: Parse the mechanism target
        run: ruby bin/process-gap-mechanism-target "$GITHUB_EVENT_PATH" > "$RUNNER_TEMP/process-gap-mechanism-target.json"

      - name: Surface the result on the issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- process-gap-mechanism-target v1 -->";
            const resultPath = `${process.env.RUNNER_TEMP}/process-gap-mechanism-target.json`;
            const result = JSON.parse(fs.readFileSync(resultPath, "utf8"));
            const knownStatuses = new Set(["not_process_gap", "valid", "unanswered", "invalid", "malformed"]);

            if (result.contract !== "process-gap-mechanism-target" ||
                result.version !== 1 ||
                !knownStatuses.has(result.status)) {
              throw new Error("The mechanism-target checker returned an invalid result contract.");
            }
            if (result.status === "not_process_gap") return;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100
            });
            const previous = comments.find((comment) =>
              comment.user?.login === "github-actions[bot]" && comment.body?.includes(marker)
            );

            if (result.status === "valid") {
              if (previous) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: previous.id
                });
              }
              return;
            }

            const allowed = "Choose exactly one of: `script`, `schema`, `checklist+replay`, or `park`.";
            const explanations = {
              unanswered: `The default placeholder is still selected. ${allowed}`,
              invalid: `The \`Mechanism target\` value is outside the accepted vocabulary. ${allowed}`,
              malformed: `The checker could not parse exactly one value under \`### Mechanism target\`. Restore that form section, then ${allowed.toLowerCase()}`
            };
            const body = `${marker}\n${explanations[result.status]}`;

            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }

            core.setFailed(explanations[result.status]);
