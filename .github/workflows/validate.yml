name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "3.4"

      - name: Resolve gem cache path
        id: gem-cache
        run: echo "dir=$(gem env gemdir)" >> "$GITHUB_OUTPUT"

      - name: Cache validation gems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.gem-cache.outputs.dir }}
          key: ${{ runner.os }}-ruby-3.4-validation-${{ hashFiles('.rubocop-version', '.json-schemer-version') }}

      - name: Install validation gems
        run: |
          gem install rubocop -v "$(tr -d '[:space:]' < .rubocop-version)" --no-document
          gem install json_schemer -v "$(tr -d '[:space:]' < .json-schemer-version)" --no-document

      - name: Run pack validation (bin/validate)
        run: bin/validate
