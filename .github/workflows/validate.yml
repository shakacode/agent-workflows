name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "3.4"

      - name: Resolve gem cache path
        id: gem-cache
        run: echo "dir=$(gem env gemdir)" >> "$GITHUB_OUTPUT"

      - name: Cache RuboCop gems
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.gem-cache.outputs.dir }}
          key: ${{ runner.os }}-ruby-3.4-rubocop-${{ hashFiles('.rubocop-version') }}

      - name: Install RuboCop
        run: gem install rubocop -v "$(tr -d '[:space:]' < .rubocop-version)" --no-document

      - name: Run pack validation (bin/validate)
        run: bin/validate
