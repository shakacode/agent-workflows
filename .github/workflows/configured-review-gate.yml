name: Configured Review Gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]

concurrency:
  group: configured-review-${{ github.repository }}-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: write

jobs:
  configured-review-gate:
    name: configured-review-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "3.4"

      - name: Require settled configured reviews
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_GATE_REPO: ${{ github.repository }}
          REVIEW_GATE_PR: ${{ github.event.pull_request.number }}
          REVIEW_GATE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REVIEW_GATE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          post_status() {
            gh api --method POST \
              "repos/${REVIEW_GATE_REPO}/statuses/${REVIEW_GATE_HEAD_SHA}" \
              -f state="$1" \
              -f context="configured-review-gate" \
              -f description="$2" \
              -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              >/dev/null
          }

          post_status pending "Waiting for exact-head configured reviews"
          if skills/pr-batch/bin/configured-review-gate evaluate \
              --repo "$REVIEW_GATE_REPO" \
              --pr "$REVIEW_GATE_PR" \
              --host github.com \
              --repo-root "$GITHUB_WORKSPACE" \
              --expected-base-sha "$REVIEW_GATE_BASE_SHA" \
              --expected-head-sha "$REVIEW_GATE_HEAD_SHA" \
              --receipt "$RUNNER_TEMP/configured-review-receipt.json" \
              --wait-seconds 900 \
              --poll-seconds 10; then
            post_status success "Configured reviews are settled for this head"
          else
            gate_status=$?
            post_status failure "Configured reviews are not merge-ready"
            exit "$gate_status"
          fi
