name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, edited, ready_for_review, reopened]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b # v1
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "dependabot[bot]"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Please review this pull request with a focus on:
            - Code quality and best practices
            - Potential bugs or issues
            - Security implications
            - Performance considerations

            Note: The PR branch is already checked out in the current working directory.

            Use `gh pr comment` for top-level feedback.
            Use `mcp__github_inline_comment__create_inline_comment` to highlight specific code issues.
            Only post GitHub comments - don't submit review text as messages.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

      # The action exits 0 even when the review never ran: an invalid or expired
      # CLAUDE_CODE_OAUTH_TOKEN makes the first API call fail in <1s at $0 cost,
      # yet the result still reports a green "pass" and posts no review. Inspect
      # the execution output and fail every silent-success/no-result case.
      #
      # Scoped to outcome == 'success' on purpose. When the action itself fails
      # (missing token on Dependabot PRs, the "workflow validation failed" safety
      # skip on PRs that edit this file, a real action error) the job is already
      # red and the action prints its own message — re-failing here would only
      # add a misleading one. A successful action outcome without a verifiable
      # Claude result cannot satisfy configured-review completion.
      - name: Verify review completed (fail on invalid/expired token)
        id: verify-review
        if: steps.claude-review.outcome == 'success'
        env:
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
        run: |
          set -euo pipefail
          TOKEN_HINT="Rotate CLAUDE_CODE_OAUTH_TOKEN with 'claude setup-token' and update the repo secret."

          # No execution output means the action skipped Claude or could not
          # prove execution; either case is non-success for this review gate.
          if [ -z "${EXECUTION_FILE:-}" ] || [ ! -f "$EXECUTION_FILE" ]; then
            echo "::error::No execution output found; no configured review was performed."
            exit 1
          fi

          # The execution file may be a JSON array or newline-delimited JSON;
          # slurp + flatten handles both, then grab the final result record.
          result=$(jq -s 'flatten | map(select(type == "object" and .type == "result")) | last' "$EXECUTION_FILE" 2>/dev/null || echo null)
          if [ "$result" = "null" ] || [ -z "$result" ]; then
            echo "::error::No result record in execution output; no configured review was verified."
            exit 1
          fi

          if ! jq -e '
            .type == "result" and
            .subtype == "success" and
            .is_error == false and
            (.num_turns | type == "number" and floor == . and . > 0) and
            (.result | type == "string" and test("\\S"))
          ' <<<"$result" >/dev/null; then
            echo "::error::Claude result record is missing explicit successful review evidence."
            exit 1
          fi

          is_error=$(echo "$result" | jq -r '.is_error')
          cost=$(echo "$result" | jq -r '.total_cost_usd // 0')
          turns=$(echo "$result" | jq -r '.num_turns')
          echo "Claude review result: is_error=$is_error total_cost_usd=$cost num_turns=$turns"

          # is_error=true with $0 cost and a single turn is the signature of an
          # invalid/expired token, but any is_error means the review failed.
          if [ "$is_error" = "true" ]; then
            echo "::error::Claude review failed (is_error=true, cost=$cost, turns=$turns). This usually means the token is invalid or expired. $TOKEN_HINT"
            exit 1
          fi

          echo "completed=true" >> "$GITHUB_OUTPUT"

      - name: Publish exact-head review artifact
        if: steps.verify-review.outputs.completed == 'true'
        env:
          GH_TOKEN: ${{ steps.claude-review.outputs.github_token }}
          REPOSITORY: ${{ github.repository }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] ||
             [[ ! "$PULL_REQUEST_NUMBER" =~ ^[1-9][0-9]*$ ]] ||
             [[ ! "$EXPECTED_HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Refusing to publish a review artifact with invalid repository, PR, or head bindings."
            exit 1
          fi

          gh api --method POST \
            "repos/${REPOSITORY}/pulls/${PULL_REQUEST_NUMBER}/reviews" \
            -f event=COMMENT \
            -f commit_id="$EXPECTED_HEAD_SHA" \
            -f body="Claude review completed for exact head ${EXPECTED_HEAD_SHA}."
