# Minimal consumer-repo policy for portable agent workflows.
# Replace n/a values with repo-specific policy as each workflow is adopted.
---
base_branch: main
# Optional: override the deterministic repository-name prefix used in batch
# titles and thread handles. Use 1-6 uppercase ASCII letters or digits. Omit
# repo_prefix when unset; this optional key does not accept the "n/a" sentinel.
# repo_prefix: "APP"
# Optional project writing guide. Select the exact built-in ASD-STE100-inspired
# preset, or create docs/writing-style.md and select its relative path. Either
# repository value overrides an optional ~/.agents/agent-workflow.yml personal
# fallback. URLs and URI references are unsupported; resolution never fetches
# remote content.
# writing_style: asd-ste100
# writing_style: docs/writing-style.md
follow_up_prefix: "Follow-up:"
review_gate: "n/a"
automation_reviewers: "claude-review (check: claude-review; GitHub Action, in-flight and terminal state observable via the checks API) and coderabbitai (check: CodeRabbit; advisory, may fail on rate limits)"
approval_exempt: "n/a"
coordination_backend: "n/a"
changelog: "n/a"
benchmark_labels: "n/a"
merge_ledger: "n/a"
ci_parity_environment: "n/a"
hosted_ci_trigger: "n/a"
hosted_qa_gate: "n/a"
ci_change_detector: "n/a"

# Optional first-phase hosted runtime QA policy. Adoption is two-phase: land
# this policy and its executable verifier first, then runtime PRs are governed
# by the trusted-base copy.
# hosted_qa_gate:
#   version: 1
#   change_paths:
#     - "app/**"
#     - "config/runtime/**"
#   target: "production"
#   deployment_verifier: ".agents/bin/verify-hosted-deployment"
#   acceptance_criteria:
#     - "sign-in"
#     - "checkout"
#   waiver_mode: "forbidden"

# Optional: configure stricter repo-owned autonomous-merge gates and bounded
# safe path groups. Omission uses the portable defaults. The seam doctor
# rejects unknown keys, duplicate keys, unsupported globs, and relaxed
# thresholds without a nonempty threshold_relaxation.rationale. A complete
# `**` component crosses zero or more path components; `*`, `?`, and bracket
# classes stay within one component.
# ADR 0003 is the source of truth for these copied portable defaults. File,
# line, and commit maxima are enforced; max_reviewed_heads is shadow-only until
# a checked calibration artifact explicitly graduates it to enforcement.
# Portable safe_path_groups defaults ship for documentation and tests. Consumer
# include and exclude patterns are added to the portable sets; a consumer can
# never remove a portable exclude. Omit safe_path_groups entirely to take the
# portable groups unchanged, and declare only the group you need to adjust. A
# group may declare only exclude, with no include, to tighten the portable set
# without widening it.
# autonomous_merge:
#   thresholds:
#     max_changed_files: 29
#     max_changed_lines: 999
#     max_commits: 9
#     max_reviewed_heads: 3
#   human_review_paths:
#     - id: "production-config"
#       pattern: "config/production/**"
#       reason: "infrastructure"
#   policy_paths:
#     - ".agents/**"
#   # Added to the portable safe path groups; never replacing them.
#   safe_path_groups:
#     documentation:
#       include:
#         - "docs/**"
#       exclude:
#         - "docs/runbooks/**"
#     tests:
#       include:
#         - "test/**"
#       exclude:
#         - "test/fixtures/runtime/**"
#   generated_paths:
#     - "dist/generated/**"

# Optional: enable the untrusted-contributor-intake skill with an explicit
# trusted-base authority. Replace OWNER/REPO before uncommenting; the seam
# doctor validates the complete mapping and the skill fails closed if omitted.
# untrusted_contributor_intake:
#   trusted_github_host: "github.com"
#   trusted_github_scheme: "https"
#   trusted_github_repo: "OWNER/REPO"
