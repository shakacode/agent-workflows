# Minimal consumer-repo policy for portable agent workflows.
# Replace n/a values with repo-specific policy as each workflow is adopted.
---
base_branch: main
# Optional: override the deterministic repository-name prefix used in batch
# titles and thread handles. Use 1-6 uppercase ASCII letters or digits. Omit
# repo_prefix when unset; this optional key does not accept the "n/a" sentinel.
# repo_prefix: "APP"
follow_up_prefix: "Follow-up:"
review_gate: "n/a"
approval_exempt: "n/a"
coordination_backend: "n/a"
changelog: "n/a"
benchmark_labels: "n/a"
merge_ledger: "n/a"
ci_parity_environment: "n/a"
hosted_ci_trigger: "n/a"
ci_change_detector: "n/a"

# Optional: configure stricter repo-owned autonomous-merge gates and bounded
# safe path groups. Omission uses the portable defaults. The seam doctor
# rejects unknown keys, duplicate keys, unsupported globs, and relaxed
# thresholds without a nonempty threshold_relaxation.rationale. A complete
# `**` component crosses zero or more path components; `*`, `?`, and bracket
# classes stay within one component.
# ADR 0003 is the source of truth for these copied portable defaults. File,
# line, and commit maxima are enforced; max_reviewed_heads is shadow-only until
# a checked calibration artifact explicitly graduates it to enforcement.
# autonomous_merge:
#   thresholds:
#     max_changed_files: 29
#     max_changed_lines: 999
#     max_commits: 9
#     max_reviewed_heads: 3
#   human_review_paths:
#     - id: "production-config"
#       pattern: "config/production/**"
#       reason: "infrastructure"
#   policy_paths:
#     - ".agents/**"
#   safe_path_groups:
#     documentation:
#       include:
#         - "docs/**"
#       exclude:
#         - "docs/runbooks/**"
#     tests:
#       include:
#         - "test/**"
#       exclude:
#         - "test/fixtures/runtime/**"
#   generated_paths:
#     - "dist/generated/**"

# Optional: enable the untrusted-contributor-intake skill with an explicit
# trusted-base authority. Replace OWNER/REPO before uncommenting; the seam
# doctor validates the complete mapping and the skill fails closed if omitted.
# untrusted_contributor_intake:
#   trusted_github_host: "github.com"
#   trusted_github_scheme: "https"
#   trusted_github_repo: "OWNER/REPO"
